name: CI/CD

# Put this file in the FinCore (backend) repository as .github/workflows/ci-cd.yml
on:
  pull_request:
  push:
    branches: [main,master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore FinCore.slnx

      - name: Build
        run: dotnet build FinCore.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test FinCore.slnx --no-build --configuration Release --verbosity normal

      # Catches Dockerfile problems before they reach the server.
      # The compose file builds the API with context "." and FinCore/Dockerfile.
      - name: Build API image
        run: docker build -f FinCore/Dockerfile -t fincore-api:ci .

  deploy:
    needs: test
    if: github.ref_name == github.event.repository.default_branch && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # Optional: in GitHub, Settings > Environments > production > "Required reviewers"
    # turns every deploy into a manual approval.
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Deploy API over SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" api
