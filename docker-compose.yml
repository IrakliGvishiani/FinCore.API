services:
  fincore.api:
    image: ${DOCKER_REGISTRY-}fincore
    build:
      context: .
      dockerfile: FinCore/Dockerfile
    container_name: fincore
    restart: unless-stopped

    depends_on:
      sqlserver:
        condition: service_healthy
      redis:
        condition: service_healthy

    ports:
      - "127.0.0.1:8080:8080"

    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Production}
      - ASPNETCORE_URLS=http://+:8080

      - ConnectionStrings__DefaultConnection=Server=sqlserver,1433;Database=FinCoreDb;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;
      - Redis__ConnectionString=redis:6379
      - Jwt__Secret=${JWT_SECRET}

      - Cloudinary__CloudName=${CLOUDINARY_CLOUD_NAME}
      - Cloudinary__ApiKey=${CLOUDINARY_API_KEY}
      - Cloudinary__ApiSecret=${CLOUDINARY_API_SECRET}

      - EmailSettings__SmtpServer=smtp-relay.brevo.com
      - EmailSettings__Port=2525
      - EmailSettings__UseSsl=false
      - EmailSettings__Sender=${SMTP_SENDER}
      - EmailSettings__Username=${SMTP_USERNAME}
      - EmailSettings__Password=${SMTP_PASSWORD}

      - AdminSeed__Email=${ADMIN_EMAIL}
      - AdminSeed__Password=${ADMIN_PASSWORD}
      - AdminSeed__PersonalNumber=${ADMIN_PERSONAL_NUMBER}
      - AdminSeed__PhoneNumber=${ADMIN_PHONE_NUMBER}
      - AdminSeed__FirstName=${ADMIN_FIRST_NAME}
      - AdminSeed__LastName=${ADMIN_LAST_NAME}

      - AppSettings__BaseUrl=${APP_BASE_URL}
      - AppSettings__FrontendBaseUrl=${FRONTEND_BASE_URL}

    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: fincore-sqlserver
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD}"
    ports:
      - "127.0.0.1:1434:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"${MSSQL_SA_PASSWORD}\" -N -C -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    volumes:
      - fincore_sqlserver_data:/var/opt/mssql

  redis:
    image: redis:7-alpine
    container_name: fincore-redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - fincore_redis_data:/data

 
  fincore.client:
    build:
      context: ../fincore-client
      dockerfile: Dockerfile
    container_name: fincore-client
    depends_on:
      - fincore.api
    ports:
      - "127.0.0.1:8091:80"
    restart: unless-stopped

volumes:
  fincore_sqlserver_data:
  fincore_redis_data: